<!DOCTYPE html>
<html>
<head>
    <title>Confetti on Page Load</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 40px;
        }
    </style>
</head>
<body>

    <h1>Welcome Nayana 🎉</h1>

    <script>

        // $(document).ready(function () {

        //     // Fire confetti when page loads
        //     confetti({
        //         particleCount: 200,
        //         spread: 120,
        //         origin: { y: 0.6 }
        //     });

        // });

        $(document).ready(function () {

    var duration = 3 * 1000;
    var end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0}
        });

        confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());

});

    </script>

</body>
</html>
