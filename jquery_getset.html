<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</head>
<body>
    <p id="para">This is a new <b>paragraph</b>in the page</p>
    <button id="btn">Show text</button>
    <button id="btn1">Show text+html</button>
    <input id="name" type="text" placeholder="Enter your name">
    <button id="btn2">Show text</button>
    <script>
    $(document).ready(function(){
        $("#btn").click(function(){
            var text=$("#para").text();
            alert(text);
        })
        $("#btn1").click(function(){
            var text=$("#para").html();
            alert(text);
        })
        $("#btn2").click(function(){
            var text=$("#name").val();
            alert(text);
        })
    })
    </script>
</body>
</html>
