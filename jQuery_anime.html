<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        body{
            text-align: center;
        }
        .box{
            background-color: black;
            width: 100px;
            height: 271px;
            border-radius: 10%;
            justify-content: center;
            position: absolute;
            left: 529px;
            top: 150px;
        }
        .traffic{
            position: relative;
            background-color: gray;
            margin: 50px;
            width: 88px;
            height: 225px;
            left: -45px;
            top: -24px;
            border-radius: 10%;
        }
        .light{
            width: 45px;
            height: 45px;
            background: #333;
            border-radius: 50%;
            margin: 30px auto;
        }
        .btn{
            margin-top: 15px;
            padding: 30px 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="traffic">
            <div class="light"id="light1"></div>
            <div class="light"id="light2"></div>
            <div class="light"id="light3"></div>
            <div class="btn"><button id="btn">Click Here</button></div>
        </div>
    </div>
    <script>
        $(document).ready(function(){
            $(".btn").click(function(){
            $("#light1")
            .animate({backgroundColor: 'red'},5000)
            .delay(5000)
            .animate({backgroundColor: '#333'}, 5000)
            .delay(8000)
            $("#light2")
            .animate({backgroundColor: 'yellow'}, 20000)
            .delay(5000)
            .animate({backgroundColor: '#333'}, 5000)
            .delay(5000)
            $("#light3")
            .animate({backgroundColor: 'green'}, 1000)
            .delay(20000)
            .animate({backgroundColor: '#333'}, 5000)
            .delay(20000)
            $(".light").css("background", "#333");

        
        });
        });
    </script>
</body>
</html>
