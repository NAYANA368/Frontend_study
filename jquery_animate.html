<!DOCTYPE html>
<html>
<head>
    <title>Animate and Delay Example</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

      <style>
        body{
            padding:30px;
        }

        #box{
            width:150px;
            height:100px;
            background:yellow;
            position:relative;
        }

        button{
            padding:10px 15px;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

<h2>jQuery animate() and delay() Demo</h2>

<button id="start">Start Animation</button>

<div id="box"></div>

  <script>
        $(document).ready(function(){

            $("#start").click(function(){

                $("#box")
                .animate({left: '300px', width: '250px', backgroundColor: 'red'}, 1000)
                .delay(1000)
                .animate({top: '150px', height: '150px',backgroundColor: "blue"}, 1000)
                .delay(1000)
                .animate({opacity: '0.3'}, 1000)
                .delay(1000)
                .animate({left: '0px', top: '0px', opacity:'1', width:'150px', height:'100px',backgroundColor: 'green'}, 1000);

            });

        });
    </script>

</body>
</html>
